<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comisión Discriminadora | Acceso</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <main class="screen screen-login">
        <header class="brand-bar brand-bar-login">
            <a class="institution-logo" href="index.html" aria-label="Inicio">
                <img src="img/logo.png" alt="Instituto Tecnológico de La Laguna">
            </a>
        </header>
        <div class="login-card">
            <h1>Comisión Discriminadora</h1>
            <form class="login-form" action="panel.html" method="get">
                <label for="usuario">Usuario</label>
                <input id="usuario" name="usuario" type="text" autocomplete="username" required>
                <label for="contrasena">Contraseña</label>
                <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
                <button class="button button-primary" type="submit">Entrar</button>
            </form>
        </div>
    </main>
</body>
</html>
