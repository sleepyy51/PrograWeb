<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Convocatoria | Panel de Control</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="screen screen-light">
        <header class="brand-bar">
            <a class="institution-logo" href="panel.html" aria-label="Panel de control">
                <img src="img/logo.png" alt="Instituto Tecnológico de La Laguna">
            </a>
            <h1>Panel de Control</h1>
        </header>
        <article class="form-card">
            <h2>Nueva Convocatoria</h2>
            <form class="convocation-form" action="confirmacion.html" method="get">
                <div class="form-row"><span class="field-icon" aria-hidden="true">EDU</span><label class="sr-only" for="nombre-convocatoria">Nombre Convocatoria</label><input id="nombre-convocatoria" name="nombre" type="text" placeholder="Nombre Convocatoria" required></div>
                <div class="form-row"><span class="field-icon" aria-hidden="true">GRP</span><label class="sr-only" for="tipo-convocatoria">Tipo de convocatoria</label><select id="tipo-convocatoria" name="tipo" required><option value="">Tipo de convocatoria</option><option>Académica</option><option>Investigación</option><option>Servicio institucional</option></select></div>
                <div class="form-row period-row"><span class="field-icon" aria-hidden="true">CAL</span><fieldset><legend>Periodo</legend><div class="date-fields"><label class="sr-only" for="fecha-inicio">Fecha de inicio</label><input id="fecha-inicio" name="inicio" type="text" placeholder="DD/MM/AAAA" required><span aria-hidden="true">-</span><label class="sr-only" for="fecha-fin">Fecha de finalización</label><input id="fecha-fin" name="fin" type="text" placeholder="DD/MM/AAAA" required></div></fieldset></div>
                <div class="form-row"><span class="field-icon" aria-hidden="true">USR</span><label class="sr-only" for="claves">Claves</label><input id="claves" name="claves" type="text" placeholder="Claves de registro (ej. INV-2026)" required></div>
                <div class="form-actions"><a class="button button-outline" href="panel.html">Cancelar</a><button class="button button-primary" type="submit">Aceptar</button></div>
            </form>
        </article>
    </main>
</body>
</html>
